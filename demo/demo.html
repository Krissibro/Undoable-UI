<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UndoableUI Demo</title>
    <script src="../dist/undoable-ui.umd.js"></script>
</head>
<body>
<h1>UndoableUI Demo</h1>
<br>
<button onclick="UndoableUI.undo()" style="font-size: 20px;">Undo</button>
<button onclick="UndoableUI.redo()" style="font-size: 20px;">Redo</button>
<br>

<h3>Checkboxes</h3>
<label>
    <input type="checkbox" id="checkbox1" /> Option 1
</label>
<br>
<label>
    <input type="checkbox" id="checkbox2" /> Option 2
</label>
<br>
<label>
    <input type="checkbox" id="checkbox3" /> Option 3
</label>
<br>
<label>
    <input type="checkbox" id="checkbox4" /> Option 4
</label>

<h3>Radio Inputs (Group "group1")</h3>
<label>
    <input type="radio" name="group1" id="radio1" /> Radio 1
</label>
<br>
<label>
    <input type="radio" name="group1" id="radio2" /> Radio 2
</label>
<br>
<label>
    <input type="radio" name="group1" id="radio3" /> Radio 3
</label>
<br>
<label>
    <input type="radio" name="group1" id="radio4" /> Radio 4
</label>

<h3>Radio Inputs (Group "group2")</h3>
<label>
    <input type="radio" name="group2" id="radio5" /> Radio 1
</label>
<br>
<label>
    <input type="radio" name="group2" id="radio6" /> Radio 2
</label>
<br>
<label>
    <input type="radio" name="group2" id="radio7" /> Radio 3
</label>
<br>
<label>
    <input type="radio" name="group2" id="radio8" /> Radio 4
</label>

<h3>Range Input</h3>
<label for="range1">Volume:</label>
<input type="range" id="range1" min="0" max="100">

<!-- Global undo/redo buttons -->


</body>
</html>
